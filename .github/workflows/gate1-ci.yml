name: Gate 1 post-merge integrity

on:
  pull_request:
    branches: [main, lane-b/course-gameplay-fix-cup-resume]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate1-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate1-core-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fail on master as active base/default
        run: |
          set -euo pipefail
          if grep -RInE --include='*.yml' --include='*.yaml' \
            -e 'branches:[[:space:]]*\[[^]]*master' \
            -e 'default[_-]branch:[[:space:]]*master' \
            -e 'base:[[:space:]]*master' \
            .github/workflows 2>/dev/null; then
            echo "MAIN_BRANCH_POLICY_FAIL: active master default/base ref in workflows"
            exit 1
          fi
          echo "MAIN_BRANCH_POLICY_OK"

      - name: Gate1 core-loop determinism
        run: |
          python3 tests/test_gate1_core_loop.py
          python3 - <<'PY'
          # Determinism: two runs yield identical step sequence + checksums for content-derived state
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path("gate1/tools").resolve()))
          from core_loop_runner import run_core_loop, REQUIRED_STEPS

          e1, ok1 = run_core_loop()
          e2, ok2 = run_core_loop()
          assert ok1 and ok2
          steps1 = [(e["step"], e["result"]) for e in e1]
          steps2 = [(e["step"], e["result"]) for e in e2]
          assert steps1 == steps2 == [(s, "pass") for s in REQUIRED_STEPS]
          # Content-derived checksums (select/start/finish) should match across runs
          content_steps = {"select_racer_course", "start", "finish", "results"}
          c1 = {e["step"]: e["state_checksum"] for e in e1 if e["step"] in content_steps}
          c2 = {e["step"]: e["state_checksum"] for e in e2 if e["step"] in content_steps}
          assert c1 == c2, (c1, c2)
          print("GATE1_DETERMINISM_OK", len(e1))
          PY

      - name: Content validation
        run: python3 -m unittest tests.test_content -v

      - name: GAME-RC-001 contract validation
        run: python3 tools/validate_game_rc_contracts.py

      - name: Upload synthetic Gate1 summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate1-pp-core-loop-summary
          path: |
            gate1/evidence/out/*summary*.json
            gate1/status/gate1_core_loop_status.json
          if-no-files-found: ignore
          retention-days: 14

  wp014-actual-production-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.1 headless
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 -o godot.zip "$url"; then
              break
            fi
            echo "Godot download attempt ${attempt} failed; sleeping..."
            sleep $((attempt * 5))
            if [[ "$attempt" -eq 5 ]]; then
              echo "Godot download failed after retries"
              exit 1
            fi
          done
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
          sudo mv Godot_v4.7.1-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: WP-014 ACTUAL_PRODUCTION_RUNTIME gate (real engine boot, real input, real save)
        run: |
          set -euo pipefail
          # Fresh checkout has no .godot/ cache; import once so class_name globals
          # (CrashWatchdog, ShoeData, LaunchArtCatalog) register before the gate.
          xvfb-run -a godot --headless --path . --import || \
            xvfb-run -a godot --headless --editor --path . --quit-after 2 || true
          timeout 240 xvfb-run -a godot --headless --path . --rendering-driver opengl3 -- --production-gate
        env:
          DISPLAY: ":99"

      - name: Wave001 cross-device contract (runtime adapter export)
        run: |
          set -euo pipefail
          pip install 'jsonschema>=4.20'
          mkdir -p gate1/evidence/out
          echo "${GITHUB_SHA}" > gate1/evidence/out/commit_sha.txt
          xvfb-run -a godot --headless --path . --rendering-driver opengl3 -- --cross-device-contract
          test -f gate1/evidence/out/cross_device_contract.json
          python3 - <<'PY'
          import json
          from jsonschema import Draft202012Validator
          from pathlib import Path
          doc = json.loads(Path("gate1/evidence/out/cross_device_contract.json").read_text())
          schema = json.loads(Path("gate1/contracts/cross_device_game_contract.v1.schema.json").read_text())
          Draft202012Validator(schema).validate(doc)
          assert doc["game_id"] == "pedestrian-pursuit"
          print("WAVE001_CROSS_DEVICE_CONTRACT_OK")
          PY
        env:
          DISPLAY: ":99"

      - name: Upload ACTUAL_PRODUCTION_RUNTIME evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp014-actual-production-runtime
          path: gate1/evidence/out/actual_production_runtime.json
          if-no-files-found: warn
          retention-days: 30

  godot-headless-no-false-green:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.1 headless
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 -o godot.zip "$url"; then
              break
            fi
            echo "Godot download attempt ${attempt} failed; sleeping..."
            sleep $((attempt * 5))
            if [[ "$attempt" -eq 5 ]]; then
              echo "Godot download failed after retries"
              exit 1
            fi
          done
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
          sudo mv Godot_v4.7.1-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Import project cache
        run: |
          set -euo pipefail
          xvfb-run -a godot --headless --path . --import || \
            xvfb-run -a godot --headless --editor --path . --quit-after 2 || true

      - name: Headless suite rejects SCRIPT ERROR false-green
        run: |
          set -euo pipefail
          export GODOT_BIN="$(command -v godot)"
          # Skip CompetitiveAiEvalSubset in CI (long); ProductionGate covered here + dedicated job.
          bash -c '
            set -euo pipefail
            ROOT="$(pwd)"
            GODOT="${GODOT_BIN}"
            mkdir -p tmp
            GODOT_FATAL_PATTERNS="SCRIPT ERROR|Parse Error|Compilation failed|Failed to load script|autoload dependency|FATAL ERROR"
            run_step() {
              local name="$1"; shift
              local log="tmp/godot-${name}.log"
              echo "=== ${name} ==="
              set +e
              "$@" >"${log}" 2>&1
              local code=$?
              set -e
              if [[ $code -ne 0 ]]; then
                echo "FAIL ${name} (exit ${code})"; tail -80 "${log}" || true; return $code
              fi
              if grep -Eiq "${GODOT_FATAL_PATTERNS}" "${log}"; then
                echo "FAIL ${name} (false-green SCRIPT/Parse/Compilation)"; rg -n -i "${GODOT_FATAL_PATTERNS}" "${log}" | head -40 || true
                return 1
              fi
              echo "PASS ${name}"
            }
            run_step startup "$GODOT" --headless --path "$ROOT" --quit-after 2
            run_step CourseProgressReacquireTest "$GODOT" --headless --path "$ROOT" --script res://tests/CourseProgressReacquireTest.gd
            run_step TestRunner "$GODOT" --headless --path "$ROOT" --script res://tests/TestRunner.gd
            run_step CourseBuildSurfaceTest "$GODOT" --headless --path "$ROOT" --script res://tests/CourseBuildSurfaceTest.gd
            run_step VerdantRaceSceneObserve "$GODOT" --headless --path "$ROOT" --script res://tests/VerdantRaceSceneObserve.gd
            echo "=== VerdantRaceSceneObserve markers ==="
            if [[ -f tmp/godot-VerdantRaceSceneObserve.log ]]; then
              grep -E "^(RACE_ENTERED|LAP_COMPLETED|CHECKPOINT_CROSSED|RESULTS_PATH|COURSE_ACCEPTED|DEVICE_RUN|RACE_STATE|TRACK_ID|LAP_COUNT|LAP_COUNT_RUNTIME|COUNTDOWN_FINISHED|DRIVE_BOUND_MSEC|DRIVEN_MSEC|LINE_STEER|INPUT_PATH)=|^RACE_SCENE_FAIL|^COURSE_OBSERVE_" tmp/godot-VerdantRaceSceneObserve.log || true
            else
              echo "OBSERVER_LOG=absent"
            fi
            # Exit 0 from the observer is not a lap. This gate fails closed.
            python3 tests/verdant_race_acceptance_gate.py tmp/godot-VerdantRaceSceneObserve.log
            run_step G2C6RuntimeTest "$GODOT" --headless --path "$ROOT" --script res://tests/G2C6RuntimeTest.gd
            run_step CupFlowTest "$GODOT" --headless --path "$ROOT" --script res://tests/CupFlowTest.gd
            run_step CupResumeTest "$GODOT" --headless --path "$ROOT" --script res://tests/CupResumeTest.gd
            run_step BetaProductStateTest "$GODOT" --headless --path "$ROOT" --script res://tests/BetaProductStateTest.gd
            run_step FullProductDepthTest "$GODOT" --headless --path "$ROOT" --script res://tests/FullProductDepthTest.gd
            run_step AchievementRuntimeTest "$GODOT" --headless --path "$ROOT" --script res://tests/AchievementRuntimeTest.gd
            # Kinetic Sole course captures (xvfb). Reject black frames in-script;
            # require CAPTURED shots so art regressions fail closed.
            run_step KineticSoleVerdantCapture xvfb-run -a "$GODOT" --path "$ROOT" --script res://tests/KineticSoleVerdantCapture.gd
            if [[ -f artifacts/kinetic_sole_verdant/CAPTURE_RUN.json ]]; then
              echo "=== KineticSoleVerdantCapture markers ==="
              grep -E "KINETIC_SOLE_|CAPTURED|CAPTURE_FAILED|black_retry" tmp/godot-KineticSoleVerdantCapture.log || true
            fi
            run_step KineticSoleCloverwindCapture xvfb-run -a "$GODOT" --path "$ROOT" --script res://tests/KineticSoleCloverwindCapture.gd
            if [[ -f artifacts/kinetic_sole_cloverwind/CAPTURE_RUN.json ]]; then
              echo "=== KineticSoleCloverwindCapture markers ==="
              grep -E "KINETIC_SOLE_|CAPTURED|CAPTURE_FAILED|black_retry" tmp/godot-KineticSoleCloverwindCapture.log || true
            fi
            run_step KineticSolePrismCapture xvfb-run -a "$GODOT" --path "$ROOT" --script res://tests/KineticSolePrismCapture.gd
            if [[ -f artifacts/kinetic_sole_prism/CAPTURE_RUN.json ]]; then
              echo "=== KineticSolePrismCapture markers ==="
              grep -E "KINETIC_SOLE_|CAPTURED|CAPTURE_FAILED|black_retry" tmp/godot-KineticSolePrismCapture.log || true
            fi
            run_step KineticSoleEmberkeepCapture xvfb-run -a "$GODOT" --path "$ROOT" --script res://tests/KineticSoleEmberkeepCapture.gd
            if [[ -f artifacts/kinetic_sole_emberkeep/CAPTURE_RUN.json ]]; then
              echo "=== KineticSoleEmberkeepCapture markers ==="
              grep -E "KINETIC_SOLE_|CAPTURED|CAPTURE_FAILED|black_retry" tmp/godot-KineticSoleEmberkeepCapture.log || true
            fi
            # Retired smokes must hard-fail (exit != 0) if invoked
            set +e
            "$GODOT" --headless --path "$ROOT" --script res://tests/AlphaProductStateTest.gd > tmp/godot-AlphaRetired.log 2>&1
            a=$?
            "$GODOT" --headless --path "$ROOT" --script res://tests/DigitalRcProductStateTest.gd > tmp/godot-DigitalRetired.log 2>&1
            d=$?
            set -e
            if [[ $a -eq 0 || $d -eq 0 ]]; then
              echo "FAIL retired smokes must not exit 0"; exit 1
            fi
            echo "PASS retired_false_green_shims_hard_fail"
            echo "FALSE_GREEN_GODOT_TESTS=0"
          '
        env:
          DISPLAY: ":99"

      - name: Upload Kinetic Sole Verdant capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kinetic-sole-verdant-dash
          path: artifacts/kinetic_sole_verdant/
          if-no-files-found: warn

      - name: Upload Kinetic Sole Cloverwind capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kinetic-sole-cloverwind-mira
          path: artifacts/kinetic_sole_cloverwind/
          if-no-files-found: warn

      - name: Upload Kinetic Sole Prism capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kinetic-sole-prism-solen
          path: artifacts/kinetic_sole_prism/
          if-no-files-found: warn

      - name: Upload Kinetic Sole Emberkeep capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kinetic-sole-emberkeep-bolt
          path: artifacts/kinetic_sole_emberkeep/
          if-no-files-found: warn

      - name: Checkout BeatLink room contract
        uses: actions/checkout@v4
        with:
          repository: gunnchOS3k/beatlink-party
          ref: fix/loopback-room-lifecycle
          path: beatlink-party

      - name: Two-member race through the room contract
        run: bash tools/run_game_session_race.sh

  verdant-repro-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.1 headless
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 -o godot.zip "$url"; then
              break
            fi
            echo "Godot download attempt ${attempt} failed; sleeping..."
            sleep $((attempt * 5))
            if [[ "$attempt" -eq 5 ]]; then
              echo "Godot download failed after retries"
              exit 1
            fi
          done
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
          sudo mv Godot_v4.7.1-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Import project cache
        run: |
          set -euo pipefail
          xvfb-run -a godot --headless --path . --import || \
            xvfb-run -a godot --headless --editor --path . --quit-after 2 || true

      - name: Solo Verdant, second solo, and first-of-batch
        run: |
          set -euo pipefail
          mkdir -p tmp/repro
          run_one() {
            local name="$1"
            local mode="$2"
            local log="tmp/repro/${name}.log"
            echo "=== ${name} mode=${mode} ==="
            set +e
            RACE_OBSERVE_MODE="${mode}" xvfb-run -a godot --headless --path . --script res://tests/VerdantRaceSceneObserve.gd >"${log}" 2>&1
            local code=$?
            set -e
            echo "PROCESS_EXIT ${name}=${code}"
            if grep -Eiq "SCRIPT ERROR|Parse Error|Failed to load script" "${log}"; then
              echo "FAIL ${name} script error"
              grep -nEi "SCRIPT ERROR|Parse Error|Failed to load script" "${log}" | head -20 || true
              exit 1
            fi
          }
          run_one solo-a solo
          run_one solo-b solo
          run_one batch-first batch-first
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path("tmp/repro")
          for path in sorted(root.glob("*.log")):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              print(f"LOG_SHA256 {path.name} {digest}")
          PY

      - name: Upload repro logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verdant-repro-diagnostics
          path: tmp/repro/*.log
          if-no-files-found: warn
          retention-days: 30
